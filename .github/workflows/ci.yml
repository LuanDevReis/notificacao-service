name: Notificacao Service CI/CD

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Executar testes
        run: ./mvnw clean test

      - name: Gerar pacote
        run: ./mvnw package -DskipTests

      - name: Login no Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir tags da imagem Docker
        if: github.event_name == 'push'
        id: docker_tags
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=lreis393/notificacao-service:latest" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "tag=lreis393/notificacao-service:dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build e push da imagem Docker
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.docker_tags.outputs.tag }}
            lreis393/notificacao-service:${{ github.sha }}